async function open_(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,u(D));return new TextDecoder().decode(out)}
